<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question to My Love</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
 font-family:Arial,Helvetica,sans-serif;
 background:linear-gradient(135deg,#ff9a9e,#fad0c4 50%,#fbc2eb);
 color:#7a1034;
 overflow:hidden;
}
.top{
 width:100%;text-align:center;padding:22px 10px 0;
 font-family:Georgia,'Times New Roman',serif;
 font-size:clamp(1.6rem,6vw,2.8rem);font-weight:bold;color:#c2185b;
}
#ask{
 position:fixed;top:0;left:0;width:100%;height:100%;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 text-align:center;padding:20px;
}
.big{font-size:clamp(4rem,14vw,7rem);margin-bottom:10px;animation:beat 1.2s infinite}
.q{font-family:Georgia,serif;font-size:clamp(2rem,8vw,3.6rem);margin-bottom:34px;color:#a00040}
.btns{display:flex;gap:26px;align-items:center;justify-content:center;flex-wrap:wrap}
button{
 border:0;border-radius:50px;font-weight:bold;font-size:1.2rem;
 padding:14px 38px;cursor:pointer;font-family:inherit;
 touch-action:manipulation;
}
#yes{background:linear-gradient(135deg,#ff4d6d,#e0115f);color:#fff;box-shadow:0 8px 22px rgba(224,17,95,.4);transition:transform .2s}
#no{background:#fff;color:#7a1034;box-shadow:0 6px 16px rgba(0,0,0,.18)}

#answer{
 position:fixed;top:0;left:0;width:100%;height:100%;
 z-index:100;
 background:linear-gradient(135deg,#ff9a9e,#fad0c4 50%,#fbc2eb);
 flex-direction:column;align-items:center;justify-content:center;
 text-align:center;padding:20px;
}
.love{font-family:Georgia,serif;font-size:clamp(2rem,8vw,3.8rem);color:#c2185b;line-height:1.3;margin:10px 0}
.love span{display:block;color:#e0115f;font-size:1.15em}
.kiss{font-size:clamp(3rem,12vw,6rem);animation:beat 1s infinite}
.heart{position:fixed;bottom:-40px;z-index:200;pointer-events:none;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
</style>
</head>
<body>

<div class="top">Question to My Love 💖</div>

<div id="ask">
 <div class="big">🥺</div>
 <h1 class="q">Do you love me?</h1>
 <div class="btns">
  <button id="yes" type="button">Yes 💕</button>
  <button id="no" type="button">No 💔</button>
 </div>
</div>

<div id="answer" style="display:none">
 <div class="kiss">😘</div>
 <h2 class="love">YES I KNOW 😁 I love you sooo much<span>Kashish 💋</span></h2>
 <div class="kiss">😘 😍 😘</div>
</div>

<script>
var askEl = document.getElementById('ask');
var answerEl = document.getElementById('answer');
var yesBtn = document.getElementById('yes');
var noBtn = document.getElementById('no');
var scale = 1;
var dodged = false;
var done = false;

function place() {
 var w = noBtn.offsetWidth, h = noBtn.offsetHeight;
 var maxX = Math.max(10, window.innerWidth - w - 10);
 var maxY = Math.max(10, window.innerHeight - h - 10);
 noBtn.style.left = (10 + Math.random() * (maxX - 10)) + 'px';
 noBtn.style.top = (10 + Math.random() * (maxY - 10)) + 'px';
}

function dodge(e) {
 if (done) return;
 if (e) { e.preventDefault(); e.stopPropagation(); }
 if (!dodged) {
  dodged = true;
  noBtn.style.position = 'fixed';
  noBtn.style.zIndex = '50';
 }
 place();
 scale = Math.min(scale + 0.1, 1.8);
 yesBtn.style.transform = 'scale(' + scale + ')';
}

noBtn.addEventListener('mouseover', dodge);
noBtn.addEventListener('touchstart', dodge, { passive: false });
noBtn.addEventListener('click', dodge);

var emojis = ['💖','💕','💗','💘','😘','❤️','💋','🌹'];
function heart() {
 var s = document.createElement('span');
 s.className = 'heart';
 s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
 s.style.left = (Math.random() * 95) + 'vw';
 s.style.fontSize = (18 + Math.random() * 30) + 'px';
 s.style.animationDuration = (4 + Math.random() * 4) + 's';
 document.body.appendChild(s);
 setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 8500);
}
setInterval(heart, 500);

function sayYes(e) {
 if (done) return;
 done = true;
 if (e) e.preventDefault();
 askEl.style.display = 'none';
 noBtn.style.display = 'none';
 answerEl.style.display = 'flex';
 for (var i = 0; i < 40; i++) { setTimeout(heart, i * 60); }
 setInterval(heart, 200);
}

yesBtn.addEventListener('click', sayYes);
yesBtn.addEventListener('touchend', sayYes);
</script>
</body>
</html>
